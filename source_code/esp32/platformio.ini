[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; === TỐC ĐỘ ===
monitor_speed = 115200
upload_speed = 921600        ; Tốc độ nạp nhanh (ổn định với ESP32)

; === ĐƯỜNG DẪN INCLUDE (BẮT BUỘC) ===
; SỬA: src_filter → build_src_filter (tránh cảnh báo)
build_src_filter = +<src/> +<src/sensor/>

; === THƯ VIỆN (TỰ ĐỘNG CÀI) ===
lib_deps = 
    adafruit/DHT sensor library@^1.4.6
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21

; === CẤU HÌNH BUILD ===
build_flags = 
    -D CORE_DEBUG_LEVEL=0    ; Tắt debug ESP32 (tiết kiệm RAM)
    ; -D ASYNC_TCP_RUNNING_CORE=1  ← XÓA DÒNG NÀY (LỖI!)